name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, phase-1]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_URL: http://localhost:3100
      TEST_DATABASE_URL: postgresql://recruiting_test:local_test_only@127.0.0.1:55332/recruiting_test
      TEST_DATABASE_RUNTIME_URL: postgresql://app_rw:local_app_only@127.0.0.1:55332/recruiting_test
      NEXT_TELEMETRY_DISABLED: '1'
      EMAIL_FROM: auth@fixture.test
      AUTH_GOOGLE_ENABLED: 'false'
      SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: 'false'
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: recruiting_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: recruiting_test
        ports:
          - 55332:5432
        options: >-
          --health-cmd "pg_isready -U recruiting_test -d recruiting_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:check
      - name: Start disposable Supabase
        shell: bash
        run: |
          mkdir -p .cache
          if ! pnpm exec supabase start > .cache/supabase-start.log 2>&1; then
            echo 'Local Supabase startup failed; credential-bearing startup output is not published.'
            exit 1
          fi
      - run: pnpm exec tsx scripts/ci-env.ts
      - name: Migrate and seed local application and Auth
        env:
          APP_ENV: local
        run: pnpm db:migrate && pnpm db:provision:local && pnpm db:seed && pnpm db:seed:auth
      - run: pnpm test
      - run: pnpm test:storage
        env:
          APP_ENV: local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf:check
      - run: pnpm security:check
      - name: Check generated API contracts
        run: |
          pnpm api:postman
          git diff --exit-code -- openapi/openapi.json tests/postman/collection.json
      - run: pnpm test:e2e
      - run: pnpm test:screens
      - run: pnpm test:api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-browser-results
          path: |
            playwright-report/
            test-results/
            tests/perf/results/
            screenshots/foundation/
            screenshots/phase-1/
          retention-days: 14
      - name: Stop disposable Supabase
        if: always()
        run: pnpm exec supabase stop

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Environment files must not be committed.'
            exit 1
          fi
      - name: Scan commit history
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --no-banner
