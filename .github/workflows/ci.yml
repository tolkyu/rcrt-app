name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, phase-1]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://app_rw:local_app_only@127.0.0.1:55332/recruiting_test
      DATABASE_MIGRATION_URL: postgresql://recruiting_test:local_test_only@127.0.0.1:55332/recruiting_test
      TEST_DATABASE_URL: postgresql://recruiting_test:local_test_only@127.0.0.1:55332/recruiting_test
      TEST_DATABASE_RUNTIME_URL: postgresql://app_rw:local_app_only@127.0.0.1:55332/recruiting_test
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: recruiting_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: recruiting_test
        ports:
          - 55332:5432
        options: >-
          --health-cmd "pg_isready -U recruiting_test -d recruiting_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm perf:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-results
          path: |
            playwright-report/
            test-results/
            screenshots/foundation/
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Environment files must not be committed.'
            exit 1
          fi
      - name: Scan commit history
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --no-banner
