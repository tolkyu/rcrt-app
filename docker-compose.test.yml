name: hris-recruiting-test

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: recruiting_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: recruiting_test
    ports:
      - '127.0.0.1:55332:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recruiting_test -d recruiting_test']
      interval: 2s
      timeout: 5s
      retries: 30
